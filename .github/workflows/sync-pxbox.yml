name: Sync 特價食材

on:
  schedule:
    # 06:00 Asia/Taipei (cron is UTC). Scheduled runs only fire on the default branch.
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-pxbox
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # SUPABASE_SERVICE_ROLE_KEY bypasses RLS - it lives only in GitHub Actions secrets and is
      # never passed to the frontend build in deploy.yml.
      - name: Sync products from 全聯全電商
        run: node scripts/sync-pxbox.mjs
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
